name: assiist_front_end
description: "Mobile follow-up assistant for relationship-based service businesses."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.7.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # ADD flutter_localizations from the SDK
  flutter_localizations:
    sdk: flutter

  # --- Existing Core & UI Dependencies --- 
  cupertino_icons: ^1.0.2
  http: ^1.1.0 # For making HTTP requests (e.g., to custom backend)
  intl: ^0.20.2 # Internationalization (pinned by flutter_localizations)

  # --- Existing Feature Dependencies --- 
  speech_to_text: ^7.0.0 # For speech-to-text input
  audio_waveforms: ^1.3.0 # For visualizing audio input
  image_picker: ^1.1.2 # For picking images
  file_picker: ^10.1.2 # For picking general files
  # provider: ^6.1.2 # Example if you use provider for state management
  # Add comments for any other specific existing dependencies

  # --- Firebase Core & Services --- 
  firebase_core: ^3.13.0 # Required to use any Firebase service
  firebase_auth: ^5.5.3 # Firebase Authentication (user login/session)
  cloud_firestore: ^5.6.7 # Firestore Database (storing user/event data)
  firebase_messaging: ^15.2.5 # Firebase Cloud Messaging (receiving push notifications)

  # --- Authentication Providers (OAuth etc.) ---
  google_sign_in: ^6.2.1 # For Google Sign-In flow
  # msal_flutter: ^1.3.0 # Add if implementing Outlook Login via MSAL

  # --- Notifications & Permissions ---
  flutter_local_notifications: ^18.0.1 # For displaying notifications locally on the device
  permission_handler: ^12.0.0+1 # For requesting device permissions (notifications, calendar)

  # --- Native Device Calendar Access ---
  device_calendar: ^4.3.1 # To read events from the device's native calendar (iOS/Android)

  # --- Secure Storage --- 
  flutter_secure_storage: ^9.0.0 # For securely storing sensitive data (like refresh tokens, if done client-side - though backend storage is recommended)
  
  # --- Utilities ---
  path_provider: ^2.1.2 # Finding commonly used locations on the filesystem
  path: ^1.8.3 # Manipulating file paths
  timezone: ^0.9.2 # For handling timezones accurately, especially for scheduling notifications
  flutter_native_timezone: ^2.0.0 # Correct package for getting device timezone

  # Add flutter_riverpod
  flutter_riverpod: ^2.4.9 # Updated Riverpod version

  # Add other dependencies here:
  jwt_decoder: ^2.0.1 # For decoding JWTs
  shared_preferences: ^2.2.2 # For simple key-value storage
  url_launcher: ^6.2.1 # For launching URLs
  provider: ^6.1.1 # State management (if needed alongside Riverpod)
  flutter_typeahead: ^5.2.0 # For autocomplete fields
  timeline_tile: ^2.0.0 # For timeline UI
  flutter_dotenv: ^5.1.0 # ADDED: For .env file loading

  # For generating unique IDs (used in dummy data)
  uuid: ^4.3.3 # ADDED uuid package back
  flutter_slidable: ^4.0.0

  app_settings: ^5.1.1

  # New dependencies
  flutter_contacts: ^1.1.9 # CORRECTED version based on pub.dev screenshot
  flutter_linkify: ^6.0.0 # For auto-linkification of URLs and deep links
  background_fetch: ^1.2.3 # For background task execution on iOS/Android

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  
  # Icon generation
  flutter_launcher_icons: ^0.13.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - .env.development
    - assets/images/
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Flutter Launcher Icons configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/logo.png"
